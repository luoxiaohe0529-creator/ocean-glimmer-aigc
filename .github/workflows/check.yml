name: Repository checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_service/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: python -m pip install -r python_service/requirements.txt

      - name: Check Node entrypoints
        run: npm run check:server

      - name: Check frontend/backend contract
        run: npm run check:entrypoints

      - name: Run Python unit tests
        run: npm run check:python

      - name: Validate public n8n workflows
        run: npm run check:workflows

      - name: Run mock demo E2E
        run: npm run check:e2e

      - name: Scan public secrets
        run: npm run check:secrets

  deploy-demo:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES_DEPLOY == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

      - name: Deploy demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
