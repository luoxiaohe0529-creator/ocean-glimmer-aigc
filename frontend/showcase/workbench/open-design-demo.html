    var files=Array.from(target.files||[]).filter(function(file){

function briefValue(brief,label){
  var aliases={

    "镜头节奏":["镜头节奏","shot_rhythm","camera_rhythm","pacing","rhythm","editing_rhythm"],
    "品牌落点":["品牌落点","brand_resolution","brand_landing","call_to_action","cta","closing","ending"]
  };
  var keys=aliases[label]||[label];
  function displayValue(value){
    if(value==null||value==="")return"";
    if(Array.isArray(value))return value.map(displayValue).filter(Boolean).join(" · ");
    if(typeof value==="object")return Object.values(value).map(displayValue).filter(Boolean).join(" · ");
    return String(value);
  }
  function findValue(value,depth){
    if(!value||typeof value!=="object"||depth>5)return"";
    var objectKeys=Object.keys(value);
    for(var i=0;i<keys.length;i++){
      var wanted=String(keys[i]).toLowerCase().replace(/[\s_-]/g,"");
      for(var j=0;j<objectKeys.length;j++){
        var actual=String(objectKeys[j]).toLowerCase().replace(/[\s_-]/g,"");
        if(actual===wanted){
          var found=displayValue(value[objectKeys[j]]);
          if(found)return found;
        }
      }
    }
    for(var k=0;k<objectKeys.length;k++){
      var child=value[objectKeys[k]];
      if(child&&typeof child==="object"){
        var nested=findValue(child,depth+1);
        if(nested)return nested;
      }
    }
    return"";
  }
  var result=findValue(brief,0);
  if(result)return result;
  return "—";
}
function normalizeCreativeBrief(payload){
  function parseMaybe(value){
    if(typeof value!=="string")return value;
    var text=value.trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
    try{return JSON.parse(text);}catch(error){return value;}
  }
  var root=parseMaybe(payload)||{};
  if(typeof root!=="object")return{};
  for(var i=0;i<5;i++){
    var next=root.creative_brief||root.creativeBrief||root.brief||(root.data&&root.data.creative_brief)||(root.output&&root.output.creative_brief)||(root.result&&root.result.creative_brief);
    next=parseMaybe(next);
    if(!next||next===root||typeof next!=="object")break;
    root=next;
  }
  return root;
}

function applyRecoveredVideo(payload, openVideoStage) {
  if (!payload) return false;
  var recoveredUrl = payload.video_url || payload.result_url || payload.videoUrl || payload.resultUrl || "";
  var recoveredSegments = Array.isArray(payload.segments) ? payload.segments : [];
  if (!recoveredUrl && !recoveredSegments.length) return false;
  state.videoResultUrl = recoveredUrl || ((recoveredSegments[0] || {}).video_url || (recoveredSegments[0] || {}).url || "");
  state.videoSegments = recoveredSegments;
  state.videoTaskId = payload.video_task_id || payload.task_id || state.videoTaskId || "";
  state.productRecordId = payload.product_record_id || state.productRecordId || "";
  state.duration = Number(payload.duration || state.duration || 15);
  if (payload.product_brief && typeof payload.product_brief === "object") state.productBrief = payload.product_brief;
  if (payload.hook && typeof payload.hook === "object") {
    var hooks = Array.isArray(state.hooksList) ? state.hooksList : [];
    var index = hooks.findIndex(function(item) {
      return item && item.hook === payload.hook.hook && item.title === payload.hook.title;
    });
    if (index >= 0) state.selectedHook = index;
    else {
      state.hooksList = [payload.hook];
      state.selectedHook = 0;
    }
  }
  if (openVideoStage) state.stage = 3;
  saveState();
  return true;
}

  if (new URLSearchParams(window.location.search).get("demo") === "1") return false;

  try {

  } catch (error) {
    localStorage.removeItem("ocean_glimmer_video_result");
  }

  // current browser state has no playable result. This avoids requiring a
  // special query parameter after a webhook response was persisted.
  if (openLatest) {
    try {
      var response = await fetch("/api/video/latest", { cache: "no-store" });
      if (response.ok) recovered = applyRecoveredVideo(await response.json(), true) || recovered;

async function loadKnowledgeFilters(mode){

});

<script>
/* Keep the three Python knowledge-base handoffs observable, and make Stage 4 subtitle-free. */
(function(){
  var entryPoints=window.__ADFLOW_ENTRY_POINTS={
    stage1:"/api/fast/stage-1",
    stage2:"/api/fast/stage-2",
    stage3:"/api/fast/stage-3",
    stage4:"/api/workflow/stage-4"
  };
  var disabledLegacyContentPaths={
    "/api/workflow/stage-1/url":true,
    "/api/workflow/stage-1/document":true,
    "/api/workflow/stage-1/tvc":true,
    "/api/workflow/stage-2":true,
    "/api/workflow/stage-3":true
  };
  var previousFetch=window.fetch;
  window.fetch=function(input,init){
    var url=typeof input==="string"?input:(input&&input.url)||"";
    if(/\/api\/(?:fast|workflow)\/stage-[1-5]/.test(url)&&init&&init.body&&typeof init.body==="string"){
      try{
        var body=JSON.parse(init.body);
        var resSel=document.querySelector("#stage1-resolution");if(resSel)state.resolution=resSel.value;
        body.resolution=state.resolution||"480p";
        body.filter_values=state.filterValues||body.filter_values||{};
        if(state.selectedPlanId&&(state.creativePlans||[]).length)body.creative_plan=(state.creativePlans||[]).find(function(plan){return plan.plan_id===state.selectedPlanId;})||body.creative_plan;
        body.selected_plan_id=state.selectedPlanId||body.selected_plan_id||"";
        var selectedHook=(state.hooksList||[])[state.selectedHook]||{};
        body.template_group_id=selectedHook.template_group_id||(body.creative_plan||{}).template_group_id||state.templateGroupId||body.template_group_id||"";
        body.content_subtype=selectedHook.content_subtype||(body.creative_plan||{}).content_subtype||state.contentSubtype||body.content_subtype||"";
        body.product_category=state.productCategory||body.product_category||"";
        if(state.directorInstruction)body.director_instruction=state.directorInstruction;
        init=Object.assign({},init,{body:JSON.stringify(body)});
      }catch(error){console.warn("request enrichment:",error.message);}
    }
    var pathname="";
    try{pathname=new URL(url,window.location.href).pathname;}catch(error){}
    if(disabledLegacyContentPaths[pathname]){
      return Promise.resolve(new Response(JSON.stringify({
        ok:false,
        error:"legacy_content_stage_disabled",
        message:"内容生成已统一走 Python 唯一入口。"
      }),{status:410,headers:{"Content-Type":"application/json"}}));
    }
    var stage4=/\/api\/(?:fast|workflow)\/stage-4/.test(url);
    if(stage4&&init&&typeof init.body==="string"){
      try{
        var payload=JSON.parse(init.body);
        payload.knowledge_trace=state.knowledgeTrace||{};
        payload.pipeline_trace=state.pipelineTrace||{};
        payload.no_subtitles=true;
        init=Object.assign({},init,{body:JSON.stringify(payload)});
      }catch(error){console.warn("Stage 4 handoff:",error.message);}
    }
    return previousFetch.call(this,input,init).then(function(response){
      if(/\/api\/(?:fast|workflow)\/stage-[23](?:\/|$)/.test(url)&&response&&response.clone){
        response.clone().json().then(function(data){
          if(!data||typeof data!=="object")return;
          state.knowledgeTrace=state.knowledgeTrace||{};
          var stage=/stage-2/.test(url)?"stage2":"stage3";
          state.knowledgeTrace[stage]=data.knowledge_trace||{source:data.knowledge_source||"unknown",role:data.knowledge_role||(/stage-2/.test(url)?"编剧导演":"摄影摄像"),api_attempted:!!data.knowledge_triggered};
          saveState();
        }).catch(function(){});
      }
      return response;
    });
  };
  document.addEventListener("click",function(event){
    if(event.target.closest('[data-action="reset"]'))state.knowledgeTrace={};
  },true);
})();
