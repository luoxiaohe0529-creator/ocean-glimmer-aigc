function briefValue(brief,label){
  var aliases={
    "推荐Hook":["推荐Hook","recommended_hook","hook"],
    "达人画像":["达人画像","creator_profile","creator_persona"],
    "目标人群":["目标人群","target_audience"],
    "口播语气":["口播语气","speaking_tone","speaking_style"],
    "核心痛点":["核心痛点","pain_point","pain_points"],
    "产品切入":["产品切入","product_entry","product_angle"],
    "使用场景":["使用场景","use_scene","usage_scenario"],
    "信任设计":["信任设计","trust_design","proof"],
    "行动引导":["行动引导","call_to_action","cta"],
    "推荐理由":["推荐理由","recommendation_reason"],
    "核心卖点":["核心卖点","core_selling_points","selling_points"],
    "比较维度":["比较维度","comparison_dimension"],
    "说服逻辑":["说服逻辑","persuasion_logic"],
    "展示方式":["展示方式","demonstration"],
    "视觉风格":["视觉风格","visual_style"],
    "创意概念":["创意概念","creative_concept","concept","big_idea","creative_idea","marketing_goal"],
    "品牌命题":["品牌命题","brand_proposition","brand_message","key_message","core_message","value_proposition"],
    "核心意象":["核心意象","core_imagery","opening_scene","hero_visual","visual_hook","key_visual"],
    "情绪基调":["情绪基调","emotional_tone","emotion_tone","emotional_trigger","tone","mood"],
    "视觉语言":["视觉语言","visual_language","visual_style","art_direction","visual_direction"],
    "色彩方案":["色彩方案","color_palette","colour_palette","color_scheme","lighting"],
    "叙事结构":["叙事结构","narrative_structure","story_structure","script_structure","narrative","story_arc"],
    "镜头节奏":["镜头节奏","shot_rhythm","camera_rhythm","pacing","rhythm","editing_rhythm"],
    "品牌落点":["品牌落点","brand_resolution","brand_landing","call_to_action","cta","closing","ending"]
  };
  var keys=aliases[label]||[label];
  function displayValue(value){
    if(value==null||value==="")return"";
    if(Array.isArray(value))return value.map(displayValue).filter(Boolean).join(" · ");
    if(typeof value==="object")return Object.values(value).map(displayValue).filter(Boolean).join(" · ");
    return String(value);
  }
  function findValue(value,depth){
    if(!value||typeof value!=="object"||depth>5)return"";
    var objectKeys=Object.keys(value);
    for(var i=0;i<keys.length;i++){
      var wanted=String(keys[i]).toLowerCase().replace(/[\s_-]/g,"");
      for(var j=0;j<objectKeys.length;j++){
        var actual=String(objectKeys[j]).toLowerCase().replace(/[\s_-]/g,"");
        if(actual===wanted){
          var found=displayValue(value[objectKeys[j]]);
          if(found)return found;
        }
      }
    }
    for(var k=0;k<objectKeys.length;k++){
      var child=value[objectKeys[k]];
      if(child&&typeof child==="object"){
        var nested=findValue(child,depth+1);
        if(nested)return nested;
      }
    }
    return"";
  }
  var result=findValue(brief,0);
  if(result)return result;
  return "—";
}
function normalizeCreativeBrief(payload){
  function parseMaybe(value){
    if(typeof value!=="string")return value;
    var text=value.trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
    try{return JSON.parse(text);}catch(error){return value;}
  }
  var root=parseMaybe(payload)||{};
  if(typeof root!=="object")return{};
  for(var i=0;i<5;i++){
    var next=root.creative_brief||root.creativeBrief||root.brief||(root.data&&root.data.creative_brief)||(root.output&&root.output.creative_brief)||(root.result&&root.result.creative_brief);
    next=parseMaybe(next);
    if(!next||next===root||typeof next!=="object")break;
    root=next;
  }
  return root;
}

function unwrapVideoPayload(payload){
  var value=payload;
  for(var depth=0;depth<4;depth++){
    if(Array.isArray(value)){value=value[0]||{};continue;}
    if(value&&typeof value==="object"&&value.json){value=value.json;continue;}
    if(value&&typeof value==="object"&&value.body){
      value=value.body;
      if(typeof value==="string"){try{value=JSON.parse(value);}catch(error){}}
      continue;
    }
    if(value&&typeof value==="object"&&value.data&&typeof value.data==="object"){value=value.data;continue;}
    break;
  }
  return value&&typeof value==="object"?value:{};
}
function collectVideoObjects(payload,items,depth){
  if(depth>7||payload==null)return items;
  if(typeof payload==="string"){
    try{return collectVideoObjects(JSON.parse(payload),items,depth+1);}catch(error){return items;}
  }
  if(Array.isArray(payload)){
    payload.forEach(function(item){collectVideoObjects(item,items,depth+1);});
    return items;
  }
  if(typeof payload!=="object")return items;
  items.push(payload);
  ["json","body","data","output","result","response"].forEach(function(key){
    if(payload[key]!=null)collectVideoObjects(payload[key],items,depth+1);
  });
  ["segments","video_segments","videoSegments","items"].forEach(function(key){
    if(payload[key]!=null)collectVideoObjects(payload[key],items,depth+1);
  });
  return items;
}
function videoUrlFromPayload(payload){
  var objects=collectVideoObjects(payload,[],0),keys=["video_url","videoUrl","result_url","resultUrl","public_url","publicUrl","output_url","outputUrl","download_url","downloadUrl","resultUrls","result_urls","fullResultUrls","full_result_urls","urls","url"];
  for(var i=0;i<objects.length;i++){
    for(var j=0;j<keys.length;j++){
      var value=objects[i][keys[j]];
      if(typeof value==="string"&&/^https?:\/\//i.test(value))return value;
      if(Array.isArray(value)){for(var k=0;k<value.length;k++){if(typeof value[k]==="string"&&/^https?:\/\//i.test(value[k]))return value[k];}}
    }
  }
  return "";
}
function videoSegmentsFromPayload(payload){
  var objects=collectVideoObjects(payload,[],0),segments=[];
  for(var i=0;i<objects.length&&!segments.length;i++){
    segments=objects[i].segments||objects[i].video_segments||objects[i].videoSegments||[];
  }
  return Array.isArray(segments)?segments.map(function(segment,index){
    var item=unwrapVideoPayload(segment),url=videoUrlFromPayload(item);
    return Object.assign({},item,{segment_index:item.segment_index||item.index||index+1,video_url:url||item.video_url||"",url:url||item.url||""});
  }):[];
}

    var recommendedIndex=state.creativePlans.findIndex(function(item){return item&&item.plan_id===state.selectedPlanId;});
    if(recommendedIndex>=0)state.selectedHook=recommendedIndex;
    if(state.creativePlans.length&&!Array.isArray(data.hooks))state.hooksList=state.creativePlans.map(planToHook);
    if(typeof saveState==="function")saveState();
  }

  function renderPlanSummary(){
    var old=document.querySelector("#creative-plan-pool-runtime");
    if(old)old.remove();
    if(state.stage!==0||!state.productReady||!(state.creativePlans||[]).length)return;
    var result=document.querySelector(".result");
    if(!result)return;
    var plans=state.creativePlans||[],moods=state.moodBoards||[];
    var moodText=moods.map(function(m){return(m.name||m.title||"")+((m.tags||[]).length?" · "+(Array.isArray(m.tags)?m.tags.join(" / "):m.tags):"");}).filter(Boolean).join("；");
    var html='<section id="creative-plan-pool-runtime" class="notice" style="margin-top:22px;border-left:4px solid var(--blue);background:var(--blue-soft)"><strong>创意方案池 · '+plans.length+' 个方向</strong>'+(moodText?'<p style="margin:7px 0;color:var(--muted)">Mood Board：'+esc(moodText)+'</p>':"")+'<div style="display:grid;gap:8px;margin-top:10px">'+plans.map(function(plan,index){var active=(plan.plan_id||"")===state.selectedPlanId||(!state.selectedPlanId&&index===state.selectedHook);var emotion=plan.emotion_direction; if(emotion&&typeof emotion==="object")emotion=emotion.primary||""; return'<button type="button" data-creative-plan="'+index+'" style="text-align:left;border:1px solid '+(active?'var(--blue)':'#d9dbe3')+';background:'+(active?'#fff':'rgba(255,255,255,.72)')+';border-radius:10px;padding:10px 12px;cursor:pointer"><strong>'+esc(plan.title||("创意方案 "+(index+1)))+'</strong><span style="display:block;margin-top:4px;color:var(--muted);font-size:12px">'+esc(plan.core_hook||plan.slogan||"")+'</span>'+(emotion?'<span style="display:block;margin-top:4px;color:var(--blue);font-size:11px">情绪：'+esc(emotion)+'</span>':"")+'</button>';}).join("")+'</div><small style="display:block;margin-top:9px;color:var(--muted)">已选方案会原样交给 Stage 2 编剧导演，再由 Stage 3 摄影摄像继续执行。</small></section>';
    result.insertAdjacentHTML("beforeend",html);
  }

  var originalFetch=window.fetch;
  window.fetch=function(input,init){
    var url=typeof input==="string"?input:(input&&input.url)||"";
    var stageUrl=/^\/api\/(?:fast\/stage-[23]|workflow\/stage-[234]|workflow\/stage-1\/(?:url|document|tvc))/.test(url);
    if(stageUrl&&init&&typeof init.body==="string"){
      try{
        var payload=JSON.parse(init.body);
        var plan=selectedPlan();
        if((url.indexOf("stage-2")>=0||url.indexOf("stage-3")>=0||url.indexOf("stage-4")>=0)&&Object.keys(plan).length){
          payload.creative_plan=plan;
          payload.selected_plan=plan;
        }
        init=Object.assign({},init,{body:JSON.stringify(payload)});
      }catch(error){console.warn("creative plan payload:",error);}
    }
    return originalFetch(input,init).then(function(response){
      if(url.indexOf("stage-1")>=0){
        response.clone().json().then(function(data){
          if(data&&data.ok!==false){applyCreativePayload(data);renderPlanSummary();}
        }).catch(function(){});
      }
      return response;
    });
  };

  var originalRender=render;
  render=function(){originalRender();renderPlanSummary();};
  document.addEventListener("click",function(event){
    var button=event.target.closest("[data-creative-plan]");
    if(button){
      var index=Number(button.dataset.creativePlan||0),plan=(state.creativePlans||[])[index];
      if(!plan)return;
      state.selectedHook=index;
      state.selectedPlanId=plan.plan_id||"";
      render();
      return;
    }
    var legacyHook=event.target.closest("[data-hook]");
    if(legacyHook&&state.creativePlans[Number(legacyHook.dataset.hook||0)]){
      var selected=state.creativePlans[Number(legacyHook.dataset.hook||0)];
      state.selectedPlanId=selected.plan_id||"";
    }
  });
  renderPlanSummary();
})();
</script>
