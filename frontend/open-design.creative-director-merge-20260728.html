    "使用场景":["使用场景","use_scene","usage_scenario"],
    "信任设计":["信任设计","trust_design","proof"],
    "行动引导":["行动引导","call_to_action","cta"],
    "推荐理由":["推荐理由","recommendation_reason"],

  var keys=aliases[label]||[label];
  for(var i=0;i<keys.length;i++)if(brief&&brief[keys[i]]!=null)return Array.isArray(brief[keys[i]])?brief[keys[i]].join(" · "):String(brief[keys[i]]);

  else if(state.scriptText||state.storyboard.length){var segments=(state.storyboardSegments&&state.storyboardSegments.length)?state.storyboardSegments:[{index:1,start:0,end:state.duration,script_text:state.scriptText,storyboard:state.storyboard}];lower='<section class="panel production-output"><div class="result-head"><div><span class="result-label">WRITER / DIRECTOR OUTPUT</span><h2>完整脚本与导演分镜</h2></div><span class="pill ready">'+state.duration+' 秒 · '+segments.length+' 段</span></div>'+(state.directorNotes&&Object.keys(state.directorNotes).length?'<div class="notice"><strong>导演说明</strong><p>'+esc(Object.values(state.directorNotes).join(" · "))+'</p></div>':'')+'<div class="production-segments">'+segments.map(function(seg,i){return'<article class="production-segment"><div class="production-segment-head"><strong>第 '+(i+1)+' 段</strong><span>'+esc((seg.start!=null?seg.start:i*15)+'–'+(seg.end!=null?seg.end:(i+1)*15)+'s')+'</span></div>'+(seg.script_text?'<div class="script-copy">'+esc(seg.script_text)+'</div>':'')+'<div class="storyboard-grid">'+directorCards(seg.storyboard||[])+'</div></article>';}).join("")+'</div><div class="director-actions"><button class="primary" data-action="go-video">进入摄影摄像 →</button><button class="secondary" data-action="generate-creative-director">重新生成</button></div></section>';}

document.addEventListener("click",function(e){
  var button=e.target.closest('[data-action="generate-creative-director"]');
  if(!button||state.loading)return;
  e.preventDefault();
  (async function(){
    var hook=state.hooksList[state.selectedHook];
    if(!hook){alert("请先选择 Hook");return;}
    state.loading=true;state.generationStep="creative";state.scriptReady=false;state.storyboardReady=false;render();
    try{
      var common={product_record_id:state.productRecordId,product_brief:state.productBrief,hooks:state.hooksList,selected_hook:hook,hook:hook,marketing_goal:state.campaignTheme||"",platform:state.mode==="真人口播带货"?"抖音":state.mode==="好物推荐"?"小红书":"全平台",content_type:state.mode,language:state.language,duration:state.duration,creative_worldview:state.creativeWorldview||{},filter_values:state.filterValues||{}};
      var optimizeResponse=await fetch("/api/workflow/stage-2/optimize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(common)});
      if(!optimizeResponse.ok)throw new Error("创意优化 HTTP "+optimizeResponse.status);
      var optimized=await optimizeResponse.json();
      state.creativeBrief=optimized.creative_brief||{};
      if(optimized.recommended_hook&&Object.keys(optimized.recommended_hook).length)hook=optimized.recommended_hook;
      if(Array.isArray(optimized.optimized_hooks)&&optimized.optimized_hooks.length)state.hooksList=optimized.optimized_hooks;
      state.generationStep="script";render();
      var scriptResponse=await fetch("/api/workflow/stage-2",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},common,{hook:hook,selected_hook:hook,creative_brief:state.creativeBrief,action:"optimize_and_script"}))});
      if(!scriptResponse.ok)throw new Error("脚本生成 HTTP "+scriptResponse.status);
      var scripted=await scriptResponse.json();
      state.scriptText=scripted.script_text||scripted.script||"";
      state.scriptSegments=Array.isArray(scripted.script_segments)?scripted.script_segments:[];
      if(!state.scriptText)throw new Error("脚本结果为空");
      state.scriptReady=true;state.generationStep="director";render();
      var directorResponse=await fetch("/api/workflow/stage-3",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},common,{hook:hook,script_text:state.scriptText,script_segments:state.scriptSegments,creative_brief:state.creativeBrief,creator_profile:state.creatorProfile||""}))});
      if(!directorResponse.ok)throw new Error("导演分镜 HTTP "+directorResponse.status);

      state.directorNotes=directed.director_notes||{};
      state.storyboard=Array.isArray(directed.storyboard)?directed.storyboard:[];
      state.storyboardSegments=Array.isArray(directed.segments)?directed.segments:[];
      state.videoTaskId=directed.video_task_id||directed.task_id||"";
      state.storyboardReady=state.storyboard.length>0||state.storyboardSegments.length>0;
      if(!state.storyboardReady)throw new Error("分镜结果为空");
    }catch(error){alert("生成失败："+error.message);}
    state.loading=false;state.generationStep="";render();
  })();
},true);
